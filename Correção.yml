name: PC Windows

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Ver informações do PC
        shell: pwsh
        run: |
          Write-Host "=== PC WINDOWS ==="
          Write-Host ""
          Write-Host "Processador:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Write-Host ""
          Write-Host "Memoria RAM:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

          Write-Host ""
          Write-Host "Armazenamento:"
          Get-PSDrive C |
            Select-Object Used, Free

      - name: Mostrar IP do Tailscale
        shell: pwsh
        run: |
          Write-Host "=== IP TAILSCALE ==="
          tailscale ip -4

      - name: Manter o PC ativo
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "PC ativo: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
